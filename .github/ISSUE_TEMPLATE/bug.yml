name: Bug report
description: Report an incorrect operation or reproducible failure.
body:
  - type: input
    id: version
    attributes:
      label: Server, Windows and Sandboxie versions
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Access profile
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected behavior
      description: Use disposable data. Do not include passwords, certificates, credentials or private sandbox contents.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed result and error code
    validations:
      required: true
